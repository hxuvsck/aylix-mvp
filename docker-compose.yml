version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: aylix_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: aylix
      POSTGRES_PASSWORD: aylix
      POSTGRES_DB: aylix
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: aylix_redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  postgres_data:
